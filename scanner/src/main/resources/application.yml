spring:
  application:
    name: scanner
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jqube_scanner}
    username: ${SPRING_DATASOURCE_USERNAME:jqube}
    password: ${SPRING_DATASOURCE_PASSWORD:jqube_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:jqube}
    password: ${RABBITMQ_PASSWORD:jqube_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/}

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

jqube:
  rabbitmq:
    scan-job-queue: jqube.scan.jobs
    result-exchange: jqube.scan.result
    result-routing-key: scan.completed

  scanner:
    workspace:
      root: ${SCANNER_WORKSPACE_ROOT:/tmp/jqube/scans}

    timeout:
      git: ${SCANNER_GIT_TIMEOUT:5m}
      semgrep: ${SCANNER_SEMGREP_TIMEOUT:10m}
      trivy: ${SCANNER_TRIVY_TIMEOUT:10m}
      gitleaks: ${SCANNER_GITLEAKS_TIMEOUT:10m}

    tools:
      git: ${GIT_BINARY:git}
      semgrep: ${SEMGREP_BINARY:semgrep}
      trivy: ${TRIVY_BINARY:trivy}
      gitleaks: ${GITLEAKS_BINARY:gitleaks}
