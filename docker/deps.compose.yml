services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: jqube-rabbitmq

    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: jqube
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jqube_dev_password}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  postgres:
    image: postgres:16
    container_name: caching-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: caching_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: caching-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: