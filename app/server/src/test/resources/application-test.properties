spring.application.name=jqube-server
spring.profiles.active=test

# Test Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jqube_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
security.jwt.secret-key=testSecretKey123456789012345678901234567890123456789012345678
security.jwt.expiration-time=3600000

# Email Configuration (Mock)
spring.mail.host=smtp.test.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# GitHub OAuth Configuration (Mock)
github.oauth.client-id=test_client_id
github.oauth.client-secret=test_client_secret
github.oauth.redirect-uri=http://localhost:3000/auth/github/callback

# Logging
logging.level.net.jqube.server=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
