server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

spring:
  application:
    name: JQUBE_API_SERVER
  config:
    import: optional:file:.env[.properties]
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  cache:
    type: redis

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  mail:
    host: smtp.gmail.com
    port: 465
    username: ${SUPPORT_EMAIL}
    password: ${APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:jqube}
    password: ${RABBITMQ_PASSWORD:jqube_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/}

    publisher-confirm-type: correlated
    publisher-returns: true

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 10

client:
  url: ${CLIENT_URL}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GITHUB_REDIRECT_URI}


security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 86400000
  encryption:
    key: ${AES_ENCRYPTION_KEY}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    doc-expansion: none

  packages-to-scan: net.jqube.server.controllers
  paths-to-match:
    - /api/**

rate-limiter:
  enabled: true
  fail-mode: OPEN # Options: OPEN, CLOSED
  general:
    limit: 100
    window: 60s
    algorithm: FIXED_WINDOW
    client-type: IP
  auth:
    limit: 10
    window: 60s
    algorithm: FIXED_WINDOW
    client-type: IP
  sensitive:
    limit: 20
    window: 60s
    algorithm: FIXED_WINDOW
    client-type: USER
  upload:
    limit: 20
    window: 60s
    algorithm: FIXED_WINDOW
    client-type: USER
