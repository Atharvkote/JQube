spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:jqube}
    password: ${RABBITMQ_PASSWORD:jqube_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/}

    publisher-confirm-type: correlated
    publisher-returns: true

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

server:
  port: 8081

jqube:
  scanner:
    workspace:
      root: ${SCANNER_WORKSPACE_ROOT:/tmp/jqube/scans}

    timeout:
      git: ${SCANNER_GIT_TIMEOUT:5m}
      semgrep: ${SCANNER_SEMGREP_TIMEOUT:10m}
      trivy: ${SCANNER_TRIVY_TIMEOUT:10m}
      gitleaks: ${SCANNER_GITLEAKS_TIMEOUT:10m}

    tools:
      git: ${GIT_BINARY:git}
      semgrep: ${SEMGREP_BINARY:semgrep}
      trivy: ${TRIVY_BINARY:trivy}
      gitleaks: ${GITLEAKS_BINARY:gitleaks}
